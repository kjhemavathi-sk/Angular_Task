<section class="filters" aria-label="Ticket filters">
  <button type="button" class="filter-trigger">☷ <span>Filter</span></button>

  <div class="filter-field">
    <label for="status-filter">Status</label>
    <select
      id="status-filter"
      name="status-filter"
      [(ngModel)]="statusFilter"
      (ngModelChange)="onStatusFilterChange($event)">
      <option value="All">All open</option>
      <option *ngFor="let status of statuses" [value]="status">{{ status }}</option>
    </select>
  </div>

  <div class="filter-field">
    <label for="priority-filter">Priority</label>
    <select
      id="priority-filter"
      name="priority-filter"
      [(ngModel)]="priorityFilter"
      (ngModelChange)="onPriorityFilterChange($event)">
      <option value="All">All priorities</option>
      <option *ngFor="let priority of priorities" [value]="priority">{{ priority }}</option>
    </select>
  </div>

  <label class="search-field" for="ticket-search">
    <span class="visually-hidden">Search tickets</span>
    <span aria-hidden="true">⌕</span>
    <input
      id="ticket-search"
      name="ticket-search"
      type="search"
      placeholder="Search"
      [(ngModel)]="searchTerm"
      (ngModelChange)="onSearchTermChange($event)" />
  </label>
</section>
